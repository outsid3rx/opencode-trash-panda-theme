  <text x="30" y="236" fill="#727a7f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">bg · panel · element · disabled · muted · text      primary · blue · cyan · purple · pink      error · warning · yellow · success · green</text>
