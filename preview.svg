  <text x="30" y="68" fill="#727a7f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">A theme for raccoons and other creatures of the night</text>

  <g transform="translate(30, 100)">
